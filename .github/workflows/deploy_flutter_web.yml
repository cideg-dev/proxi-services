name: Deploy Flutter Web to GitHub Pages

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Required to push changes back

      - name: Update Backend Version from Release Tag
        if: github.event_name == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Extract version from tag (e.g., v1.2.3 -> 1.2.3)
          VERSION=$(echo ${{ github.ref_name }} | sed 's/v//')
          
          echo "Updating backend version to $VERSION"
          npm --prefix backend version $VERSION --no-git-tag-version
          
          # Commit and push the updated package.json and package-lock.json
          git add backend/package.json backend/package-lock.json
          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "ci(backend): Bump version to $VERSION"
            git push
          else
            echo "No version change detected in backend."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build web
        working-directory: ./frontend
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Remove source maps
        # Remove .map files to make it harder to retrieve original sources
        run: |
          echo "Removing source map files from frontend/build/web..."
          find ./frontend/build/web -type f -name '*.map' -print -delete || true
          # Also remove any debug info files if present
          find ./frontend/build/web -type f -name 'main.dart.js.map' -print -delete || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web
          publish_branch: gh-pages
